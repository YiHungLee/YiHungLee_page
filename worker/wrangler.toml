#:schema node_modules/wrangler/config-schema.json
name = "yi-hung-lee-contact-form"
main = "contact-form.js"
compatibility_date = "2026-10-15"

# 部署時保留在 Cloudflare Dashboard 設定的環境變數（例如 ALLOWED_ORIGINS），避免被清空。
# NOTIFY_TO（通知信收件信箱）請設成 Secret，Secret 不會被部署覆蓋。
keep_vars = true

# Workers Logs：保存 Worker 的日誌，可在 Dashboard → Worker → Logs 查詢送出失敗的紀錄
[observability]
enabled = true

# 訊息資料庫（結構見 worker/schema.sql）
[[d1_databases]]
binding = "DB"
database_name = "contact-form"
database_id = "6ab5ec47-56da-4123-8009-e9fb09dae9d0"

# 通知信：透過 Cloudflare Email Routing 寄到已驗證的信箱（收件信箱由 Secret NOTIFY_TO 指定）
[[send_email]]
name = "EMAIL"

# 速率限制：同一個 IP 每 60 秒最多送出 5 次（需要 wrangler 4.36.0 以上）
# namespace_id 是自訂的整數，同一個帳號內不要和其他 Worker 重複
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "7301"

  [ratelimits.simple]
  limit = 5
  period = 60

# Production environment
[env.production]
name = "yi-hung-lee-contact-form"
route = { pattern = "contact.lee-yi-hung.com", zone_name = "lee-yi-hung.com", custom_domain = true }

# For local development
[dev]
port = 8787
